name: CI

on:
  push:
    branches: [main]

jobs:
  check:
    name: Check, test and build
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check formatting and lint
        run: vp check

      - name: Unit tests
        run: vp test

      - name: Typecheck
        run: vp run typecheck

      - name: Native self-tests
        run: vp run test:native

      - name: Build
        run: |
          vp run build
          test -x .output/server/native/monitor
